name: Prod

# Release to production by version tag (CICD.md §7). Nothing is rebuilt: the
# images dev.yml built, scanned, signed and deployed are retagged.
#
#   git checkout main && git pull
#   git tag -a v1.4.0 -m "Release 1.4.0" && git push origin v1.4.0
#
#   verify          tag format, commit on main, the dev.yml run for the commit
#                   passed INCLUDING DAST, the version is not released yet
#   deploy          deploy.yml: `production` approval, retag, verify signatures,
#                   deploy when DEPLOY_ENABLED is true on `production`
#   github-release  GitHub Release with generated notes
#
# Because DAST is required, dev deploy must work before the first release.
# Test the gate once first (CICD.md §7): a throwaway tag such as
# v0.0.1-gate-test on a commit whose dev run failed must stop in `verify`.
# Needs (repository owner, not applied yet): tag ruleset for v*, environment
# `production` with required reviewers. See pipeline-settings-checklist.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is vMAJOR.MINOR.PATCH and on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tagged commit is not on main"; exit 1; }

      - name: The dev.yml run for this commit passed, DAST included
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow dev.yml --commit "$GITHUB_SHA" --status success \
            --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || { echo "::error::No passing dev.yml run for $GITHUB_SHA"; exit 1; }
          dast=$(gh run view "$run_id" --json jobs \
            --jq '[.jobs[] | select(.name | startswith("DAST")) | .conclusion] | first // ""')
          [ "$dast" = success ] \
            || { echo "::error::DAST did not pass for this commit (result: '${dast}')"; exit 1; }

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The version is not released yet
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          for name in $(jq -r '.[].name' .github/services.json); do
            if docker buildx imagetools inspect "ghcr.io/${owner}/labdsof-${name}:${version}" >/dev/null 2>&1; then
              echo "::error::${name}:${version} already exists; released versions are never overwritten"
              exit 1
            fi
          done

  deploy:
    name: Promote and deploy
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      tag: ${{ github.ref_name }}
      promote_sha: ${{ github.sha }}

  github-release:
    name: GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
