name: Service (shared steps)

# Shared steps for ONE service. Not run directly: <service>.yml calls this.
#   mode pr:   build/test, hadolint, image build (not scanned, not pushed)
#   mode main: build/test, then build, push, scan, attest and sign the image
#
# Every third-party action is pinned to a full commit SHA (version in the
# comment), resolved with `gh api` on 2026-11-15.
#
# SIGNING IDENTITY - read before moving or renaming this file. The cosign
# certificate identity is the workflow file that contains the signing job, so
# release.yml (US-19, not implemented yet) and deploy-dev in main.yml verify
#   https://github.com/<owner>/<repo>/.github/workflows/_service.yml@refs/heads/main
# Expected from how GitHub OIDC works, to be confirmed on the first real
# signed image. Renaming this file, or moving signing to another repository,
# changes the identity: update release.yml and deploy-dev in the same PR.

on:
  workflow_call:
    inputs:
      name:
        description: "Service name, lowercase (image: ghcr.io/<owner>/<repo>-<name>)"
        type: string
        required: true
      dir:
        description: "Service folder, also the Docker build context"
        type: string
        required: true
      language:
        description: "maven, python or node"
        type: string
        required: true
      mode:
        description: "pr or main"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ inputs.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java services (Spring Boot 4.1, Maven, ADR-002). `verify` runs unit
      # tests, ArchUnit boundary tests (ADR-009) and integration tests. Those
      # start real MySQL 8.4 and RabbitMQ containers themselves (Testcontainers,
      # to be confirmed in EN01-U9); the runner's Docker daemon is enough.
      - name: Set up Java 25
        if: inputs.language == 'maven'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ inputs.dir }}/pom.xml
      - name: Maven verify
        if: inputs.language == 'maven'
        run: mvn --batch-mode --no-transfer-progress verify

      # ai-triage (Python 3.14, Flask, pytest).
      - name: Set up Python 3.14
        if: inputs.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install dependencies and run pytest
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          for f in requirements.txt requirements-dev.txt; do
            if [ -f "$f" ]; then pip install -r "$f"; fi
          done
          pip install pytest
          python -m pytest

      # client (React + Vite, Vitest). `npm test` is expected to run Vitest.
      - name: Set up Node
        if: inputs.language == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ inputs.dir }}/package-lock.json
      - name: Install, build and test
        if: inputs.language == 'node'
        run: |
          npm ci
          npm run build --if-present
          npm test

  hadolint:
    name: hadolint (${{ inputs.name }})
    if: inputs.mode == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.dir }}/Dockerfile
          failure-threshold: warning

  # Build only: proves the Dockerfile builds. Not scanned and never pushed; the
  # Trivy scan runs in `publish` on the pushed image (team decision).
  image-build:
    name: Image build (${{ inputs.name }})
    if: inputs.mode == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (not pushed)
        run: docker build -t "bmc-ci/${{ inputs.name }}:ci" "${{ inputs.dir }}"

  publish:
    name: Publish (${{ inputs.name }})
    if: inputs.mode == 'main'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Elevated for this job only. The calling job must grant the same.
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing and attestation (GitHub OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One image per service: ghcr.io/<owner>/<repo>-<service>, lowercase
      # (CICD.md §6). The only tag is sha-<sha>; never `latest`.
      - name: Compute image name
        id: image
        env:
          SERVICE: ${{ inputs.name }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}-${SERVICE}" >>"$GITHUB_OUTPUT"

      # Single architecture (linux/amd64) by team decision. To add arm64, add
      # docker/setup-qemu-action before buildx and set
      # platforms: linux/amd64,linux/arm64.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.dir }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max

      # Scan the pushed digest. A failure stops the job before signing, so a
      # vulnerable image is never signed and deploy-dev refuses it.
      - name: Container scan of the pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0; tags on this action were force-pushed in 2026, so the commit is pinned
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
