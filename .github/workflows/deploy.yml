name: Deploy

# Deploys the already published and signed images to one environment.
# Called by dev.yml (dev) and prod.yml (production), or started by hand
# (Actions -> Deploy -> Run workflow) to redeploy or roll back a tag
# (CICD.md §7). Production always waits for the `production` approval.
#
# 1. validate the tag   2. (release only) retag dev-<commit> as the version
# 3. verify every signature   4. deploy   5. smoke check
#
# Steps 4-5 run only when the environment variable DEPLOY_ENABLED is "true"
# (set on the `dev` / `production` environment); otherwise the run verifies and
# stops. Step 4 needs, on that environment: secrets AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY (IAM user bmc-deploy-<env>, labdsof-infra
# bootstrap/deploy-access.tf) and variable AWS_REGION. The URL is APP_URL if
# set, else the edge host's current public IP.
#
# Services come from .github/services.json. Pins: full commit SHAs resolved
# with `gh api` on 2026-11-15.

on:
  workflow_call:
    inputs:
      environment:
        description: "dev or production"
        type: string
        required: true
      tag:
        description: "dev-<commit> (dev) or a version such as v1.4.0 (production)"
        type: string
        required: true
      promote_sha:
        description: "Release only: retag dev-<this commit> as the version first"
        type: string
        default: ""
    outputs:
      deployed:
        description: "true if the deploy really happened"
        value: ${{ jobs.deploy.outputs.deployed }}
      url:
        description: "The environment's APP_URL"
        value: ${{ jobs.deploy.outputs.url }}
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options: [dev, production]
        required: true
      tag:
        description: "Image tag: dev-<commit> or a version such as 1.4.0 (not the moving dev tag)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }} # `production` has required reviewers
    permissions:
      contents: read
      packages: write # only the release retag writes; callers must grant it
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
      url: ${{ steps.result.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/services.json
            compose.yaml
          sparse-checkout-cone-mode: false

      - name: Validate the request
        id: req
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG#v}" # release tag v1.4.0 -> image tag 1.4.0
          case "$ENVIRONMENT" in dev|production) ;; *) echo "::error::Unknown environment '$ENVIRONMENT'"; exit 1;; esac
          [ "$TAG" != latest ] || { echo "::error::Refusing to deploy 'latest'"; exit 1; }
          [[ "$TAG" =~ ^(dev-[0-9a-f]{7,40}|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]] \
            || { echo "::error::Tag '$TAG' is neither dev-<commit> nor a version like 1.4.0"; exit 1; }
          if [ "$ENVIRONMENT" = production ] && [[ "$TAG" == dev-* ]]; then
            echo "::error::Production only runs released versions"; exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "services=$(jq -r '[.[].name] | join(" ")' .github/services.json)" >>"$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same digest under a new tag, so the signature still applies.
      - name: Retag the dev image as the version (no rebuild)
        if: inputs.promote_sha != ''
        env:
          TAG: ${{ steps.req.outputs.tag }}
          SERVICES: ${{ steps.req.outputs.services }}
          PROMOTE_SHA: ${{ inputs.promote_sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for name in $SERVICES; do
            image="ghcr.io/${owner}/labdsof-${name}"
            docker buildx imagetools create -t "${image}:${TAG}" "${image}:dev-${PROMOTE_SHA}"
          done

      # Identity = the workflow file that signs (dev.yml, see its header).
      - name: Verify the signature of every image
        env:
          TAG: ${{ steps.req.outputs.tag }}
          SERVICES: ${{ steps.req.outputs.services }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for name in $SERVICES; do
            cosign verify "ghcr.io/${owner}/labdsof-${name}:${TAG}" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/dev.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          done
          echo "All signatures valid for ${TAG}"

      # Deploy over SSM Run Command (labdsof-infra, README "Application
      # deploy"): sign in as bmc-deploy-<env> (key in this environment's
      # secrets), copy compose.yaml to the application host and run
      # bmc-app-deploy <tag> there; it reads the database passwords from
      # Parameter Store and runs docker compose pull + up. No SSH.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: vars.DEPLOY_ENABLED == 'true'
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy
        id: deploy
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          TAG: ${{ steps.req.outputs.tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          env_tag="$ENVIRONMENT"; [ "$env_tag" = production ] && env_tag=prod
          host() { # instance attribute of the running host with this Role tag
            aws ec2 describe-instances \
              --filters "Name=tag:Environment,Values=$env_tag" "Name=tag:Role,Values=$1" Name=instance-state-name,Values=running \
              --query "Reservations[].Instances[].$2" --output text
          }
          app=$(host app InstanceId)
          [ -n "$app" ] && [ "$(wc -w <<<"$app")" -eq 1 ] \
            || { echo "::error::Expected one running application host in $env_tag, found: '${app}'"; exit 1; }
          edge_ip=$(host edge PublicIpAddress)

          jq -n --arg compose "$(base64 -w0 compose.yaml)" --arg tag "$TAG" '{commands: [
              "set -euo pipefail",
              "echo \($compose) | base64 -d > /opt/bmc-app/compose.yaml",
              "/usr/local/bin/bmc-app-deploy \($tag)"
            ]}' >"$RUNNER_TEMP/params.json"
          id=$(aws ssm send-command --instance-ids "$app" --document-name AWS-RunShellScript \
            --comment "Deploy $TAG (run $GITHUB_RUN_ID)" --timeout-seconds 900 \
            --parameters "file://$RUNNER_TEMP/params.json" --query Command.CommandId --output text)
          echo "SSM command $id on $app"

          status=Pending
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$app" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$app" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          [ "$status" = Success ] || { echo "::error::Deploy command ended with $status"; exit 1; }
          echo "url=http://${edge_ip}" >>"$GITHUB_OUTPUT"

      # Readiness endpoints are internal (ADR-004); check the public entry point.
      # APP_URL (a fixed address, once there is a domain) or the edge host's
      # current public IP from the deploy step.
      - name: Smoke check
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          URL: ${{ vars.APP_URL || steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors --max-time 20 "${URL}/" >/dev/null

      - name: Result
        id: result
        env:
          ENABLED: ${{ vars.DEPLOY_ENABLED }}
          URL: ${{ vars.APP_URL || steps.deploy.outputs.url }}
        run: |
          if [ "$ENABLED" = true ]; then deployed=true; else deployed=false; echo "DEPLOY_ENABLED is not true: verified only, nothing deployed."; fi
          echo "deployed=$deployed" >>"$GITHUB_OUTPUT"
          echo "url=$URL" >>"$GITHUB_OUTPUT"
