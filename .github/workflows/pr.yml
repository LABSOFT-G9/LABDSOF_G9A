name: PR

# Pull-request checks (CICD.md §3). Nothing is pushed or deployed.
#   repo-wide:   secrets scan, CodeQL, buf (once contracts/proto exists)
#   per service: build and test, hadolint, image build (not scanned, not pushed),
#                only for the services whose folder the PR changes
#   platform:    the messaging starter, only when platform/ changes
#   sign-in:     the local stack signs a synthetic user in through the edge,
#                only when what it starts changes
#   ci-required: the single check the branch ruleset requires
#
# The service list is .github/services.json; scripts/ci-changed-services.sh
# picks the entries a PR changes. A change to the pipeline or the shared build
# (services.json, .github/actions/, this file, that script), or a diff that
# cannot be computed, selects everything. There is deliberately no `paths:`
# filter: a skipped workflow never reports `ci-required`, so a docs-only PR
# would wait forever. Jobs with nothing to do are skipped instead, and
# `ci-required` accepts skipped.
#
# Every third-party action is pinned to a full commit SHA (version in the
# comment), resolved with `gh api` on 2026-11-15.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  services:
    name: Load services
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      list: ${{ steps.load.outputs.list }}
      platform: ${{ steps.load.outputs.platform }}
      sign_in: ${{ steps.load.outputs.sign_in }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the base commit
          persist-credentials: false
      - id: load
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/ci-changed-services.sh "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false
      # gitleaks image instead of gitleaks-action (which needs a licence once the
      # repo moves to an organisation, CICD.md §11.5). v8.30.1, digest read
      # 2026-11-15. False positives are listed in .gitleaksignore.
      - run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --exit-code 1

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Fork PRs get a read-only token, so the results upload would fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  contracts:
    name: Protobuf contracts (buf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Does nothing until contracts/proto exists. `buf breaking` also needs
      # contracts/proto on main as a baseline.
      - name: Check for a baseline on main
        id: baseline
        if: hashFiles('contracts/proto/**') != ''
        run: |
          git fetch --no-tags --depth=1 origin main
          if git cat-file -e origin/main:contracts/proto 2>/dev/null; then
            echo "has_base=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_base=false" >>"$GITHUB_OUTPUT"
          fi
      - if: hashFiles('contracts/proto/**') != ''
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          input: contracts/proto
          lint: true
          format: false
          breaking: ${{ steps.baseline.outputs.has_base == 'true' }}
          breaking_against: ${{ format('{0}/{1}.git#branch=main,subdir=contracts/proto', github.server_url, github.repository) }}
          pr_comment: false
          push: false
          archive: false
      # The AsyncAPI document names the same events as the .proto files.
      - if: hashFiles('contracts/proto/**') != ''
        name: Proto and AsyncAPI agree
        run: scripts/check-contracts.sh

  build-test:
    name: Build and test (${{ matrix.service.name }})
    needs: services
    if: needs.services.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-test
        with:
          dir: ${{ matrix.service.dir }}
          language: ${{ matrix.service.language }}

  # Shared code under platform/ has no image, so it is not in services.json.
  # Its integration tests start MySQL 8.4 and RabbitMQ 4.4 with Testcontainers.
  platform:
    name: Build and test (messaging starter)
    needs: services
    if: needs.services.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-test
        with:
          dir: platform/bmc-messaging-spring-boot-starter
          language: maven

  hadolint:
    name: hadolint (${{ matrix.service.name }})
    needs: services
    if: needs.services.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.service.dir }}/Dockerfile
          failure-threshold: warning

  # Proves the Dockerfile builds. Not scanned and never pushed: Trivy scans the
  # pushed image in dev.yml (team decision).
  image-build:
    name: Image build (${{ matrix.service.name }})
    needs: services
    if: needs.services.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t "bmc-ci/${{ matrix.service.name }}:pr" "${{ matrix.service.dir }}"

  # EN-02-04: the Backend-for-Frontend session end to end (ADR-005). Starts the
  # part of the local stack that sign-in needs, with throwaway secrets, and
  # runs scripts/e2e-signin.sh: 401 without a session, sign-in at Keycloak as
  # a synthetic account, /me through the edge, the CSRF header, sign-out.
  sign-in:
    name: Sign-in end to end (local stack)
    needs: services
    if: needs.services.outputs.sign_in == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write .env with throwaway secrets
        run: |
          secret() { openssl rand -hex "$1"; }
          sed -E \
            -e "s|^(MYSQL_ROOT_PASSWORD)=.*|\1=$(secret 16)|" \
            -e "s|^([A-Z]+_DB_PASSWORD)=.*|\1=$(secret 16)|" \
            -e "s|^(KEYCLOAK_ADMIN_PASSWORD)=.*|\1=$(secret 16)|" \
            -e "s|^(BMC_EDGE_CLIENT_SECRET)=.*|\1=$(secret 24)|" \
            -e "s|^(OIDC_PLUGIN_SECRET)=.*|\1=$(secret 16)|" \
            -e "s|^(BMC_SYNTHETIC_USER_PASSWORD)=.*|\1=$(secret 12)|" \
            .env.example >.env
          # No value is printed; fail if a placeholder survived.
          ! grep -q 'change-me' .env
      - name: Start Traefik, Keycloak, MySQL, Mailpit, Issue and the client
        run: |
          docker compose -f compose.yaml -f compose.local.yaml up --build --detach \
            traefik keycloak mysql mailpit issue client
      - name: Sign in through the edge
        run: |
          set -a; . ./.env; set +a
          scripts/e2e-signin.sh
      - name: Container state and logs
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.local.yaml ps --all
          docker compose -f compose.yaml -f compose.local.yaml logs --no-color --tail 200 traefik keycloak issue

  ci-required:
    name: ci-required
    if: always()
    needs: [services, secrets-scan, codeql, contracts, build-test, platform, hadolint, image-build, sign-in]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Skipped is fine (CodeQL on fork PRs, jobs a change does not need);
      # failed or cancelled is not.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1;; esac
          done
