name: Metrics Snapshot

on:
  schedule:
    - cron: "0 18 * * *" # Daily at midnight in Lisbon
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # main is protected (PR + review from someone else), so the snapshot is
    # delivered as a pull request. While a metrics PR is open, each run adds its
    # snapshot to that PR's branch, so unmerged days are never lost.
    env:
      GH_TOKEN: ${{ secrets.MY_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}

      - name: Use the open metrics PR branch, or start a new one
        id: branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          open=$(gh pr list --base main --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("metrics/"))][0].headRefName // ""')
          if [ -n "$open" ]; then
            git fetch origin "$open"
            git checkout -B "$open" "origin/$open"
            git merge --no-edit origin/main
            echo "name=$open" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            name="metrics/$(date -u +%Y-%m-%d)"
            git checkout -b "$name"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}
        run: node workflow-scripts/snapshot.js

      - name: Commit and open or update the metrics PR
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          NEW: ${{ steps.branch.outputs.new }}
        run: |
          git add workflow-scripts/data/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "update metrics"
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "Nothing to deliver"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          if [ "$NEW" = "true" ]; then
            gh pr create --base main --head "$BRANCH" --title "update metrics" \
              --body "Automated daily snapshot from Metrics Snapshot (metrics.yml). Later runs add to this PR until it is merged. Review: only \`workflow-scripts/data/\` changes."
          fi
          # Merges by itself once approved, if auto-merge is enabled in the repo settings.
          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            || echo "::notice::Auto-merge not set; a maintainer merges the metrics PR after approval."
