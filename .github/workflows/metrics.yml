name: Metrics Snapshot

on:
  schedule:
    - cron: "0 18 * * *" # Daily at midnight in Lisbon
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: metrics
    timeout-minutes: 10

    # main is protected (PR + review from someone else). The metrics GitHub App
    # is the only bypass actor on the main-review ruleset, so the snapshot is
    # pushed straight to main with the App's token. The App secrets live in the
    # `metrics` environment, which only allows main. MY_PAT (a repository
    # secret) is still needed to read personal project 9, which the App cannot see.
    steps:
      - name: Create metrics App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.METRICS_APP_CLIENT_ID }}
          private-key: ${{ secrets.METRICS_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}
        run: node workflow-scripts/snapshot.js

      - name: Commit and push to main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add workflow-scripts/data/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "update metrics"
          # main may have moved during the run; the snapshot only touches data files.
          git pull --rebase origin main
          git push origin HEAD:main
