name: Metrics Snapshot

on:
  schedule:
    - cron: "0 18 * * *" # Daily at midnight in Lisbon
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: metrics
    timeout-minutes: 10

    # main is protected (PR + review from someone else). The metrics GitHub App
    # is the only bypass actor on the main-review ruleset, so the snapshot is
    # pushed straight to main with the App's token. The App secrets live in the
    # `metrics` environment, which only allows main. MY_PAT (a repository
    # secret) is still needed to read personal project 9, which the App cannot see.
    steps:
      - name: Create metrics App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.METRICS_APP_CLIENT_ID }}
          private-key: ${{ secrets.METRICS_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The App token is not left in .git/config while the script runs;
          # the push step passes it explicitly.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}
        run: node workflow-scripts/snapshot.js

      - name: Commit and push to main
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          # Commit as the App so the history shows who pushed.
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add workflow-scripts/data/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          # The App can bypass main's review rule, so only data files may be committed.
          unexpected=$(git status --porcelain | grep -v ' workflow-scripts/data/' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected changes outside workflow-scripts/data/:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "update metrics"
          url="https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
          # main may have moved during the run; the snapshot only touches data files.
          for attempt in 1 2 3; do
            git pull --rebase "$url" main
            if git push "$url" HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::error::Could not push the snapshot to main after 3 attempts"
          exit 1
