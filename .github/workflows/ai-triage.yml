name: AI triage service

# One file per service. To add a service, copy this file, change the three
# values below, and add one job for it to ci.yml and main.yml.
on:
  workflow_call:
    inputs:
      mode:
        description: "pr or main"
        type: string
        required: true

permissions:
  contents: read

jobs:
  service:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_service.yml
    with:
      name: ai-triage
      dir: services/ai-triage
      language: python
      mode: ${{ inputs.mode }}
