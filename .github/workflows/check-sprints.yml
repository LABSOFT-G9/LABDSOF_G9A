name: Validate chart data

on:
  schedule:
    # After the 06:00 Lisbon collection, even if it starts late, and before the UTC day
    # ends: a missing snapshot for today fails here while a manual run can still fill it.
    - cron: "0 18 * * *" # Daily at 18:00 in Lisbon
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-chart-data
  cancel-in-progress: false

jobs:
  validate-chart-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Snapshots are pushed straight to main by metrics.yml, so main holds the
      # current history.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate live issues and chart history
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}
        run: node workflow-scripts/validate-chart-data.js