name: Validate chart data

on:
  schedule:
    - cron: "0 15 * * *"
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-chart-data
  cancel-in-progress: false

jobs:
  validate-chart-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Snapshots wait in an open metrics PR until it is merged; validate that
      # history so the freshness check does not fail while the PR is open.
      - name: Use the open metrics PR history, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --base main --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("metrics/"))][0].headRefName // ""')
          if [ -n "$open" ]; then
            git fetch origin "$open"
            git checkout "origin/$open" -- workflow-scripts/data/
            echo "Validating history from $open"
          fi
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate live issues and chart history
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}
        run: node workflow-scripts/validate-chart-data.js