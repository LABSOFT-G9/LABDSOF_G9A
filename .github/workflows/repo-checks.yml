name: Repository checks

# Checks that cover the whole repository, not one service (CICD.md §5).
# Called by ci.yml (mode pr) and main.yml (mode main).
# Pins: full commit SHAs resolved with `gh api` on 2026-11-15.

on:
  workflow_call:
    inputs:
      mode:
        description: "pr or main"
        type: string
        required: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false
      # The gitleaks image is used directly instead of gitleaks-action: the
      # action needs a licence key for organisation-owned repositories, and
      # CICD.md §11.5 considers moving to an organisation.
      # ghcr.io/gitleaks/gitleaks v8.30.1, index digest read on 2026-11-15.
      - name: Scan full history
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --exit-code 1

  # Pull requests only. The steps do nothing until contracts/proto exists.
  contracts:
    name: Protobuf contracts (buf)
    if: inputs.mode == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `buf breaking` needs a baseline: contracts/proto on main. It is skipped
      # when main does not have it yet (the PR that introduces the contracts).
      - name: Check for a baseline on main
        id: baseline
        if: hashFiles('contracts/proto/**') != ''
        run: |
          git fetch --no-tags --depth=1 origin main
          if git cat-file -e origin/main:contracts/proto 2>/dev/null; then
            echo "has_base=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_base=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        if: hashFiles('contracts/proto/**') != ''
        with:
          input: contracts/proto
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' && steps.baseline.outputs.has_base == 'true' }}
          breaking_against: ${{ format('{0}/{1}.git#branch=main,subdir=contracts/proto', github.server_url, github.repository) }}
          pr_comment: false
          push: false
          archive: false

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Fork PRs get a read-only token, so the results upload would fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
