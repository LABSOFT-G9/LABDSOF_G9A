name: Checks

# Reusable quality gate. Called by ci.yml (pull requests) and main.yml (push to
# main) so both run exactly the same checks (CICD.md §3, §5).
#
# No application code exists yet (EN-02, #68). Services are discovered by the
# presence of a Dockerfile (scripts/ci/discover_services.py), so every job that
# depends on a service, a language or contracts/proto is skipped until it
# exists, and starts running by itself when it lands.
#
# Action pins: every third-party action is pinned to a full commit SHA; the
# version is in the trailing comment. SHAs resolved with `gh api` on 2026-11-15.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  discover:
    name: Discover services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.discover.outputs.services }}
      has_services: ${{ steps.discover.outputs.has_services }}
      codeql: ${{ steps.discover.outputs.codeql }}
      has_codeql: ${{ steps.discover.outputs.has_codeql }}
      has_proto: ${{ steps.discover.outputs.has_proto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: discover
        run: python3 scripts/ci/discover_services.py

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false
      # The gitleaks image is used directly instead of gitleaks-action: the
      # action needs a licence key for organisation-owned repositories, and
      # CICD.md §11.5 considers moving to an organisation.
      # ghcr.io/gitleaks/gitleaks v8.30.1, index digest read on 2026-11-15.
      - name: Scan full history
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --exit-code 1

  build-test:
    name: Build and test (${{ matrix.service.name }})
    needs: discover
    if: needs.discover.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java services (Spring Boot 4.1, Maven, ADR-002). `verify` runs unit
      # tests (surefire), ArchUnit boundary tests (ADR-009) and integration
      # tests (failsafe). Integration tests start real MySQL 8.4 and RabbitMQ
      # containers themselves (Testcontainers, to be confirmed in EN01-U9);
      # the runner's Docker daemon is enough, no service containers are needed.
      - name: Set up Java 25
        if: matrix.service.lang == 'maven'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.service.dir }}/pom.xml
      - name: Maven verify
        if: matrix.service.lang == 'maven'
        run: mvn --batch-mode --no-transfer-progress verify

      # ai-triage (Python 3.14, Flask, pytest).
      - name: Set up Python 3.14
        if: matrix.service.lang == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        if: matrix.service.lang == 'python'
        run: |
          python -m pip install --upgrade pip
          for f in requirements.txt requirements-dev.txt; do
            if [ -f "$f" ]; then pip install -r "$f"; fi
          done
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          pip install pytest
      - name: Pytest
        if: matrix.service.lang == 'python'
        run: python -m pytest

      # client (React + Vite, Vitest). `npm test` is expected to run Vitest.
      - name: Set up Node
        if: matrix.service.lang == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.service.dir }}/package-lock.json
      - name: Install, build and test
        if: matrix.service.lang == 'node'
        run: |
          npm ci
          npm run build --if-present
          npm test

      - name: Unknown layout
        if: matrix.service.lang == 'unknown'
        run: |
          echo "::error::No pom.xml, requirements*.txt, pyproject.toml or package.json next to ${{ matrix.service.dockerfile }}"
          exit 1

  contracts:
    name: Protobuf contracts (buf)
    needs: discover
    if: needs.discover.outputs.has_proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `buf breaking` needs a baseline: contracts/proto on main. It is skipped
      # when main does not have it yet (the PR that introduces the contracts).
      - name: Check for a baseline on main
        id: baseline
        run: |
          git fetch --no-tags --depth=1 origin main
          if git cat-file -e origin/main:contracts/proto 2>/dev/null; then
            echo "has_base=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_base=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          input: contracts/proto
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' && steps.baseline.outputs.has_base == 'true' }}
          breaking_against: ${{ format('{0}/{1}.git#branch=main,subdir=contracts/proto', github.server_url, github.repository) }}
          pr_comment: false
          push: false
          archive: false

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: discover
    # Fork PRs get a read-only token, so the results upload would fail.
    if: >-
      needs.discover.outputs.has_codeql == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.discover.outputs.codeql) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  hadolint:
    name: hadolint (${{ matrix.service.name }})
    needs: discover
    if: needs.discover.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.service.dockerfile }}
          failure-threshold: warning

  image-scan:
    name: Image build and Trivy (${{ matrix.service.name }})
    needs: discover
    if: needs.discover.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built for the runner's architecture only and never pushed. The
      # multi-arch build happens in main.yml.
      - name: Build image (not pushed)
        run: docker build -t "bmc-ci/${{ matrix.service.name }}:ci" -f "${{ matrix.service.dockerfile }}" "${{ matrix.service.dir }}"
      - name: Container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0; tags on this action were force-pushed in 2026, so the commit is pinned
        with:
          image-ref: bmc-ci/${{ matrix.service.name }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
