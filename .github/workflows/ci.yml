name: CI

# Pull-request checks (CICD.md §3). Nothing is pushed or deployed here.
# One job per service, plus repo-wide checks. To add a service, add its job
# below and in main.yml (see notification.yml).
#
# There is deliberately NO `paths:` filter. The ruleset will require the single
# check `ci-required`; a workflow skipped by a path filter never reports it, and
# a docs-only PR would wait forever.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repo:
    permissions:
      contents: read
      security-events: write # CodeQL results
      actions: read
    uses: ./.github/workflows/repo-checks.yml
    with:
      mode: pr

  notification:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/notification.yml
    with:
      mode: pr

  issue:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/issue.yml
    with:
      mode: pr

  dispatch:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/dispatch.yml
    with:
      mode: pr

  calendar-sim:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/calendar-sim.yml
    with:
      mode: pr

  ai-triage:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/ai-triage.yml
    with:
      mode: pr

  client:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/client.yml
    with:
      mode: pr

  # One stable check name for the branch ruleset, whatever the number of
  # services. A skipped job is fine; failed or cancelled is not.
  ci-required:
    name: ci-required
    if: always()
    needs: [repo, notification, issue, dispatch, calendar-sim, ai-triage, client]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
