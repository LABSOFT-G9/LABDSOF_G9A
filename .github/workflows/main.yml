name: Main

# Push to main (CICD.md §3, §8): same checks as pull requests, then per service
# build for amd64 and arm64, push sha-<sha>, scan, attest and sign, then (when
# enabled) deploy to dev and run the DAST baseline.
#
# SIGNING IDENTITY - read before moving this file. release.yml (US-19, not
# implemented yet) will run
#   cosign verify ... --certificate-identity \
#     https://github.com/<owner>/<repo>/.github/workflows/main.yml@refs/heads/main
# The certificate identity is the path of THE workflow that signs. If the
# signing job later moves to a reusable workflow, possibly in the future infra
# repository (team decision 2026-11-15), the identity changes and release.yml
# verification and deploy-dev verification must change in the same PR.
#
# Never pushes `latest`. Production is never built here (release.yml retags).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false # never cancel a publish half-way

jobs:
  checks:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/checks.yml

  discover:
    name: Discover services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.discover.outputs.services }}
      has_services: ${{ steps.discover.outputs.has_services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: discover
        run: python3 scripts/ci/discover_services.py

  publish:
    name: Publish (${{ matrix.service.name }})
    needs: [checks, discover]
    if: needs.discover.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Elevated for this job only.
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing and attestation (GitHub OIDC)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One image per service: ghcr.io/<owner>/<repo>-<service>, all lowercase
      # (CICD.md §6). The tag is sha-<sha> only.
      - name: Compute image name
        id: image
        env:
          SERVICE: ${{ matrix.service.name }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}-${SERVICE}" >>"$GITHUB_OUTPUT"

      # arm64 is built with QEMU emulation. Native arm64 runners are an open
      # decision (EN01-U9).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service.dir }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max

      # Scan the pushed digest. A failure stops the job before signing, so a
      # vulnerable image is never signed and deploy-dev refuses it.
      - name: Container scan of the pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0; tags on this action were force-pushed in 2026, so the commit is pinned
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # Skipped until the dev host exists (US-17-01, #83): set the repository (or
  # `dev` environment) variable DEV_DEPLOY_ENABLED=true and DEV_URL to enable
  # it. scripts/deploy.py is still a placeholder and exits non-zero, so enabling
  # this before the deploy target is wired makes the run fail on purpose.
  deploy-dev:
    name: Deploy to dev
    needs: [publish, discover]
    if: vars.DEV_DEPLOY_ENABLED == 'true' && needs.discover.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the signature of every image
        env:
          SERVICES: ${{ needs.discover.outputs.services }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          for name in $(jq -r '.[].name' <<<"$SERVICES"); do
            cosign verify "ghcr.io/${repo}-${name}:sha-${GITHUB_SHA}" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/main.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Deploy
        run: python3 scripts/deploy.py dev "sha-${GITHUB_SHA}"

      # Readiness endpoints are internal and never routed (ADR-004), so the
      # smoke check requests the public entry point (client behind Traefik).
      - name: Smoke check
        env:
          DEV_URL: ${{ vars.DEV_URL }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors --max-time 20 "${DEV_URL}/" >/dev/null

  dast:
    name: DAST (ZAP baseline)
    needs: deploy-dev
    if: vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Passive baseline against the dev URL only. `-I` stops warnings from
      # failing the scan; the step below fails the run on High alerts.
      # ZAP image: ghcr.io/zaproxy/zaproxy 2.17.0, index digest read on 2026-11-15.
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.DEV_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          cmd_options: -I
          allow_issue_writing: false
          artifact_name: zap-baseline
      - name: Fail on high-risk alerts
        run: |
          high=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' report_json.json)
          echo "High-risk alerts: ${high}"
          [ "${high}" -eq 0 ]
