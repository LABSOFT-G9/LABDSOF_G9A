name: Main

# Push to main = deploy to dev (CICD.md §3). Runs the repo-wide checks and each
# service workflow in mode main (build/test, then build, push, scan, attest and
# sign), then deploys to dev and runs the DAST baseline when enabled.
# Never pushes `latest`. Production is never built here (release.yml retags).
#
# To add a service: add its job below, and add its name to SERVICES in deploy-dev.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false # never cancel a publish half-way

jobs:
  repo:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/repo-checks.yml
    with:
      mode: main

  notification:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/notification.yml
    with:
      mode: main

  issue:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/issue.yml
    with:
      mode: main

  dispatch:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/dispatch.yml
    with:
      mode: main

  calendar-sim:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/calendar-sim.yml
    with:
      mode: main

  ai-triage:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/ai-triage.yml
    with:
      mode: main

  client:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/client.yml
    with:
      mode: main

  # Skipped until the dev host exists (US-17-01, #83): set the repository (or
  # `dev` environment) variable DEV_DEPLOY_ENABLED=true and DEV_URL to enable
  # it. scripts/deploy.py is still a placeholder and exits non-zero, so enabling
  # this before the deploy target is wired makes the run fail on purpose.
  deploy-dev:
    name: Deploy to dev
    needs: [repo, notification, issue, dispatch, calendar-sim, ai-triage, client]
    if: vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Identity is the shared workflow that signs, see _service.yml.
      - name: Verify the signature of every image
        env:
          SERVICES: notification issue dispatch calendar-sim ai-triage client
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          for name in $SERVICES; do
            cosign verify "ghcr.io/${repo}-${name}:sha-${GITHUB_SHA}" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/_service.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Deploy
        run: python3 scripts/deploy.py dev "sha-${GITHUB_SHA}"

      # Readiness endpoints are internal and never routed (ADR-004), so the
      # smoke check requests the public entry point (client behind Traefik).
      - name: Smoke check
        env:
          DEV_URL: ${{ vars.DEV_URL }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors --max-time 20 "${DEV_URL}/" >/dev/null

  dast:
    name: DAST (ZAP baseline)
    needs: deploy-dev
    if: vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Passive baseline against the dev URL only. `-I` stops warnings from
      # failing the scan; the step below fails the run on High alerts.
      # ZAP image: ghcr.io/zaproxy/zaproxy 2.17.0, index digest read on 2026-11-15.
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.DEV_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          cmd_options: -I
          allow_issue_writing: false
          artifact_name: zap-baseline
      - name: Fail on high-risk alerts
        run: |
          high=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' report_json.json)
          echo "High-risk alerts: ${high}"
          [ "${high}" -eq 0 ]
