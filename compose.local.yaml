# Local stack (EN-02-03, DEVOPS-02): compose.yaml plus what a laptop needs.
#
#   cp .env.example .env        # then change the passwords
#   docker compose -f compose.yaml -f compose.local.yaml up --build
#   open http://localhost
#
# On top of compose.yaml this file:
#   - builds every service from its folder instead of pulling it from GHCR
#     (tagged ghcr.io/labsoft-g9/labdsof-<service>:local, never pushed);
#   - adds MySQL 8.4, the same image as the database host, with the four
#     databases and users (local/mysql/init.sh); data in the volume `mysql`;
#   - points the services at it (DB_HOST=mysql);
#   - keeps plain HTTP on port 80: Let's Encrypt cannot issue a certificate for
#     localhost, and browsers treat http://localhost as a secure context.
# Only Traefik publishes a port (80). MySQL is reachable only
# on the `database` network; use `docker compose exec mysql mysql -uroot -p`.
# Start again from an empty database: `docker compose ... down -v`.

services:
  # HTTP only: replaces compose.yaml's command and ports (HTTPS, Let's Encrypt).
  traefik:
    command: !override
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=bmc_edge
      - --api.dashboard=false
      - --experimental.plugins.traefik-oidc-auth.modulename=github.com/sevensolutions/traefik-oidc-auth
      - --experimental.plugins.traefik-oidc-auth.version=v0.24.0
    ports: !override
      - "${BMC_LOCAL_PORT:-80}:80"
    labels:
      traefik.http.routers.oidc.entrypoints: web
      # Plain HTTP: a `Secure` cookie would not be stored by every browser.
      traefik.http.middlewares.oidc.plugin.traefik-oidc-auth.SessionCookie.Secure: "false"

  keycloak:
    build: infra/keycloak
    labels:
      traefik.http.routers.keycloak.entrypoints: web
    networks: [database]
    environment:
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_HOSTNAME: ${BMC_LOCAL_URL:-http://localhost}/auth
      BMC_PUBLIC_URL: ${BMC_LOCAL_URL:-http://localhost}
      BMC_SMTP_FROM: no-reply@bmc.example
      BMC_SEED_SYNTHETIC: "true"
    depends_on:
      mysql: { condition: service_healthy }

  client:
    build: services/client
    labels:
      traefik.http.routers.client.entrypoints: web

  issue:
    build: services/issue
    labels:
      traefik.http.routers.issue.entrypoints: web
    networks: [database]
    environment:
      DB_HOST: mysql
      OIDC_ISSUER_URI: ${BMC_LOCAL_URL:-http://localhost}/auth/realms/bmc
      BMC_SEED_SYNTHETIC: "true"
    depends_on:
      mysql: { condition: service_healthy }

  dispatch:
    build: services/dispatch
    labels:
      traefik.http.routers.dispatch.entrypoints: web
    networks: [database]
    environment:
      DB_HOST: mysql
      OIDC_ISSUER_URI: ${BMC_LOCAL_URL:-http://localhost}/auth/realms/bmc
      BMC_SEED_SYNTHETIC: "true"
    depends_on:
      mysql: { condition: service_healthy }

  notification:
    build: services/notification
    labels:
      traefik.http.routers.notification.entrypoints: web
    networks: [database]
    environment:
      DB_HOST: mysql
      OIDC_ISSUER_URI: ${BMC_LOCAL_URL:-http://localhost}/auth/realms/bmc
    depends_on:
      mysql: { condition: service_healthy }

  ai-triage:
    build: services/ai-triage

  calendar-sim:
    build: services/calendar-sim
    environment:
      # Local work and failure demos script outcomes through /control.
      SIM_CONTROL_ENABLED: "true"

  # Same image and pin as the database host (labdsof-infra,
  # ansible/roles/database/files/compose.yaml).
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env}
      ISSUE_DB_PASSWORD: ${ISSUE_DB_PASSWORD:?set it in .env}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:?set it in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set it in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set it in .env}
    volumes:
      - mysql:/var/lib/mysql
      # Runs once, on the first start with an empty volume.
      - ./local/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # The root password is passed through the environment, not the command line.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [database]

networks:
  # No internet access needed: MySQL talks only to the services.
  database:
    internal: true

volumes:
  mysql: {}
