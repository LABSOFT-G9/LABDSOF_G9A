# BMC Notification service. Every value that differs per environment comes from
# the environment (compose.yaml, .env.example); secrets never live here.
spring:
  application:
    name: notification
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notification}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=PREFERRED
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:}
    hikari:
      # Fail fast: a request must not hang when MySQL is down (503).
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

# Health on a separate port that Traefik never routes (ADR-004, DEVOPS-02):
# /healthz (liveness, no external checks) and /readyz (readiness, includes MySQL).
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
          additional-path: "management:/healthz"
        readiness:
          include: readinessState,db
          additional-path: "management:/readyz"

bmc:
  security:
    issuer-uri: ${OIDC_ISSUER_URI:}
    jwk-set-uri: ${OIDC_JWK_SET_URI:}
    audience: ${OIDC_AUDIENCE:bmc-api}
    # Custom header required on every state-changing request (ADR-005 CSRF),
    # as in Issue and Dispatch.
    csrf-header: ${CSRF_HEADER:X-BMC-CSRF}
  notification:
    consumer:
      # Proposals to calibrate (ADR-007, EN01-U7), not measured values.
      max-attempts: 5
      retry-delay: 2s
