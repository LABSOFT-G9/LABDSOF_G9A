# Static server for the client build (ADR-002, ADR-011). Traefik routes `/` here; /api, /auth and the OIDC paths
# never reach this container (ADR-004/005). Every response carries the security headers below.

map $uri $bmc_cache_control {
    # Content-hashed files never change: cache them for a year.
    ~^/assets/  "public, max-age=31536000, immutable";
    # index.html, sw.js, the manifest and icons: always revalidate, so a deploy is seen at once.
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Restrictive CSP (EN-02-05): only our own origin. No inline or third-party script; 'unsafe-inline' for styles
    # only, because Radix positions popovers with inline style attributes. connect-src 'self': the API is same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $bmc_cache_control always;

    # A missing hashed asset is a 404, not index.html served as JavaScript.
    location /assets/ {
        try_files $uri =404;
    }

    # Single-page app: unknown paths render index.html and the client router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
