syntax = "proto3";

package bmc.dispatch.v1;

import "bmc/dispatch/v1/time_window.proto";

option java_multiple_files = true;
option java_package = "pt.isep.bmc.contracts.dispatch.v1";

// A booking was confirmed, by the calendar or by hand.
message BookingConfirmed {
  string issue_id = 1;
  TimeWindow window = 2;
  // `calendar` or `manual`. A manual confirmation is never shown as synchronised.
  string source = 3;
  // The intervention state after this event: `awaiting_approval`, `sent`,
  // `scheduling_pending`, `booked`, `in_progress`, `completion_reported`,
  // `declined`, `cancellation_pending`, `cancelled` or `closed`.
  string intervention_state = 4;
}
