syntax = "proto3";

package bmc.dispatch.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "pt.isep.bmc.contracts.dispatch.v1";

// A booking window. In JSON both ends are RFC 3339 timestamps in UTC.
message TimeWindow {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}
