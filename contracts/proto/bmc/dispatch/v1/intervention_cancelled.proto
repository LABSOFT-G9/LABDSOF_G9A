syntax = "proto3";

package bmc.dispatch.v1;

option java_multiple_files = true;
option java_package = "pt.isep.bmc.contracts.dispatch.v1";

// The intervention was cancelled.
message InterventionCancelled {
  string issue_id = 1;
  // A code, never free text. An administrator's cancellation (US-08-01):
  // `no_longer_needed`, `contractor_unavailable`, `rescheduling` or `other`.
  // US-09 adds the codes for Issue's closure events.
  string reason_code = 2;
  // The intervention state after this event: `awaiting_approval`, `sent`,
  // `scheduling_pending`, `booked`, `in_progress`, `completion_reported`,
  // `declined`, `cancellation_pending`, `cancelled` or `closed`.
  string intervention_state = 3;
}
