syntax = "proto3";

package bmc.issue.v1;

option java_multiple_files = true;
option java_package = "pt.isep.bmc.contracts.issue.v1";

// The issue was cancelled. Dispatch cancels the active intervention, if any.
message IssueCancelled {
  string issue_id = 1;
  optional string active_intervention_id = 2;
}
